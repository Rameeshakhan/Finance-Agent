<svg width="680" height="780" viewBox="0 0 680 780" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>FinBot LangGraph Architecture</title>
  <desc>Architecture diagram: User → Gradio → LangGraph (Agent Node → Conditional Router → ToolNode → Tools) with MemorySaver checkpointing</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #1a1a1a; }
    .th { font-size: 14px; font-weight: 600; }
    .ts { font-size: 12px; fill: #555; }
    .box-blue   { fill: #e6f1fb; stroke: #185fa5; }
    .box-purple { fill: #eeedfe; stroke: #534ab7; }
    .box-teal   { fill: #e1f5ee; stroke: #0f6e56; }
    .box-amber  { fill: #faeeda; stroke: #854f0b; }
    .box-coral  { fill: #faece7; stroke: #993c1d; }
    .box-green  { fill: #eaf3de; stroke: #3b6d11; }
    .box-gray   { fill: #f1efe8; stroke: #5f5e5a; }
    .arr        { stroke: #888; stroke-width: 1.5; fill: none; }
    .dashed     { stroke-dasharray: 5 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- USER -->
  <rect x="270" y="20" width="140" height="44" rx="8" class="box-gray" stroke-width="0.5"/>
  <text class="th" x="340" y="46" text-anchor="middle">User</text>
  <line x1="340" y1="64" x2="340" y2="96" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="348" y="84">prompt</text>

  <!-- GRADIO -->
  <rect x="210" y="98" width="260" height="56" rx="8" class="box-purple" stroke-width="0.5"/>
  <text class="th" x="340" y="120" text-anchor="middle">Gradio Interface</text>
  <text class="ts" x="340" y="140" text-anchor="middle">Chat UI · session thread_id</text>
  <line x1="340" y1="154" x2="340" y2="192" class="arr" marker-end="url(#arrow)"/>
  <text class="ts" x="348" y="178">HumanMessage</text>

  <!-- LANGGRAPH CONTAINER -->
  <rect x="30" y="190" width="620" height="390" rx="16" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="6 4"/>
  <text class="ts" x="50" y="210">LangGraph Workflow</text>

  <!-- AGENT NODE -->
  <rect x="210" y="220" width="260" height="66" rx="8" class="box-blue" stroke-width="0.5"/>
  <text class="th" x="340" y="244" text-anchor="middle">Agent Node</text>
  <text class="ts" x="340" y="264" text-anchor="middle">GPT-4o · SystemPrompt · tool binding</text>
  <line x1="340" y1="286" x2="340" y2="322" class="arr" marker-end="url(#arrow)"/>

  <!-- CONDITIONAL ROUTER -->
  <rect x="240" y="322" width="200" height="50" rx="8" class="box-amber" stroke-width="0.5"/>
  <text class="th" x="340" y="342" text-anchor="middle">Conditional Router</text>
  <text class="ts" x="340" y="360" text-anchor="middle">has tool_calls?</text>

  <!-- YES → ToolNode -->
  <line x1="340" y1="372" x2="340" y2="404" stroke="#1D9E75" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
  <text class="ts" x="350" y="392" fill="#0F6E56">YES</text>

  <!-- TOOL NODE -->
  <rect x="210" y="404" width="260" height="44" rx="8" class="box-teal" stroke-width="0.5"/>
  <text class="th" x="340" y="426" text-anchor="middle">ToolNode</text>

  <!-- Loop back arrow -->
  <path d="M470 426 L530 426 L530 253 L470 253" class="arr dashed" marker-end="url(#arrow)"/>
  <text class="ts" x="536" y="340">tool results</text>

  <!-- NO → END -->
  <line x1="240" y1="347" x2="162" y2="347" stroke="#993C1D" stroke-width="1.5" fill="none" marker-end="url(#arrow-red)"/>
  <text class="ts" x="200" y="338" text-anchor="middle" fill="#993C1D">NO</text>
  <rect x="60" y="325" width="100" height="44" rx="8" class="box-coral" stroke-width="0.5"/>
  <text class="th" x="110" y="348" text-anchor="middle">END</text>
  <path d="M110 325 L110 140 L210 140" class="arr dashed" marker-end="url(#arrow)"/>
  <text class="ts" x="68" y="220">response</text>

  <!-- TOOLS label -->
  <text class="ts" x="340" y="475" text-anchor="middle">External APIs + Custom Tools</text>

  <!-- Tool boxes -->
  <rect x="36" y="490" width="120" height="56" rx="8" class="box-green" stroke-width="0.5"/>
  <text class="th" x="96" y="512" text-anchor="middle">Stock Price</text>
  <text class="ts" x="96" y="532" text-anchor="middle">Yahoo Finance</text>

  <rect x="170" y="490" width="120" height="56" rx="8" class="box-green" stroke-width="0.5"/>
  <text class="th" x="230" y="512" text-anchor="middle">Crypto Price</text>
  <text class="ts" x="230" y="532" text-anchor="middle">CoinGecko</text>

  <rect x="304" y="490" width="120" height="56" rx="8" class="box-green" stroke-width="0.5"/>
  <text class="th" x="364" y="512" text-anchor="middle">Exchange Rate</text>
  <text class="ts" x="364" y="532" text-anchor="middle">Open ExchangeRate</text>

  <rect x="438" y="490" width="100" height="56" rx="8" class="box-gray" stroke-width="0.5"/>
  <text class="th" x="488" y="512" text-anchor="middle">Calculator</text>
  <text class="ts" x="488" y="532" text-anchor="middle">Python math</text>

  <rect x="552" y="490" width="96" height="56" rx="8" class="box-gray" stroke-width="0.5"/>
  <text class="th" x="600" y="512" text-anchor="middle">Web Search</text>
  <text class="ts" x="600" y="532" text-anchor="middle">Tavily (opt.)</text>

  <!-- Tool arrows -->
  <line x1="260" y1="448" x2="96" y2="490" class="arr" marker-end="url(#arrow)"/>
  <line x1="290" y1="448" x2="230" y2="490" class="arr" marker-end="url(#arrow)"/>
  <line x1="340" y1="448" x2="364" y2="490" class="arr" marker-end="url(#arrow)"/>
  <line x1="390" y1="448" x2="488" y2="490" class="arr" marker-end="url(#arrow)"/>
  <line x1="420" y1="448" x2="600" y2="490" class="arr" marker-end="url(#arrow)"/>

  <!-- MEMORY -->
  <rect x="30" y="598" width="620" height="80" rx="12" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="5 3"/>
  <text class="ts" x="50" y="618">Memory (LangGraph MemorySaver)</text>
  <rect x="60" y="630" width="170" height="36" rx="8" class="box-purple" stroke-width="0.5"/>
  <text class="th" x="145" y="652" text-anchor="middle">Thread checkpoints</text>
  <rect x="254" y="630" width="170" height="36" rx="8" class="box-purple" stroke-width="0.5"/>
  <text class="th" x="339" y="652" text-anchor="middle">Conversation history</text>
  <rect x="448" y="630" width="170" height="36" rx="8" class="box-purple" stroke-width="0.5"/>
  <text class="th" x="533" y="652" text-anchor="middle">Multi-turn memory</text>
  <line x1="250" y1="286" x2="145" y2="630" class="arr dashed" marker-end="url(#arrow)"/>
  <text class="ts" x="140" y="575">read/write state</text>

  <!-- LEGEND -->
  <rect x="30" y="718" width="620" height="46" rx="8" fill="none" stroke="#ccc" stroke-width="0.5"/>
  <rect x="46" y="733" width="14" height="14" rx="3" class="box-blue" stroke-width="0"/>
  <text class="ts" x="66" y="743">LLM node</text>
  <rect x="146" y="733" width="14" height="14" rx="3" class="box-amber" stroke-width="0"/>
  <text class="ts" x="166" y="743">Router</text>
  <rect x="246" y="733" width="14" height="14" rx="3" class="box-teal" stroke-width="0"/>
  <text class="ts" x="266" y="743">Tool executor</text>
  <rect x="366" y="733" width="14" height="14" rx="3" class="box-green" stroke-width="0"/>
  <text class="ts" x="386" y="743">External API tools</text>
  <rect x="506" y="733" width="14" height="14" rx="3" class="box-purple" stroke-width="0"/>
  <text class="ts" x="526" y="743">Memory / UI</text>
</svg>
